name: Test and Lint

on:
  push:
    branches-ignore: [ release ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version-file: '.node-version'
        cache: 'npm'
    - run: npm ci
    - run: npm run test

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version-file: '.node-version'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run format-check
    - run: npm run typecheck
    - run: npm run build
